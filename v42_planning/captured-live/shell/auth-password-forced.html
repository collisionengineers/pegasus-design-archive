    <h1>Set a new password before continuing</h1>
    <p>You cannot use Pegasus until the password issued to you is replaced. Choose a new password and confirm it.</p>
<section class="">
    <div class="">
        
        <form method="post" class="stack">
            <input type="hidden" data-val="true" data-val-required="The OperationKey field is required." id="OperationKey" name="OperationKey" value="74a870e881d741348126ce2f98ff6a6e" />
            <div class="field">
                <label for="NewPassword">New password</label>
                <div class="password-control">
                    <input type="password" autocomplete="new-password" data-val="true" data-val-length="The field New password must be a string with a maximum length of 256." data-val-length-max="256" data-val-minlength="The new password must be at least 8 characters." data-val-minlength-min="8" data-val-required="Enter a new password." id="NewPassword" maxlength="256" name="NewPassword" />
                    <button type="button" class="password-reveal" data-password-reveal aria-controls="NewPassword" aria-pressed="false" aria-label="Show password" hidden>Show</button>
                </div>
                <span class="field-error field-validation-valid" data-valmsg-for="NewPassword" data-valmsg-replace="true"></span>
            </div>
            <div class="field">
                <label for="ConfirmPassword">Confirm new password</label>
                <div class="password-control">
                    <input type="password" autocomplete="new-password" data-val="true" data-val-equalto="The passwords do not match." data-val-equalto-other="*.NewPassword" data-val-required="Confirm the new password." id="ConfirmPassword" name="ConfirmPassword" />
                    <button type="button" class="password-reveal" data-password-reveal aria-controls="ConfirmPassword" aria-pressed="false" aria-label="Show password" hidden>Show</button>
                </div>
                <span class="field-error field-validation-valid" data-valmsg-for="ConfirmPassword" data-valmsg-replace="true"></span>
            </div>
            <button type="submit" class="btn btn--primary" data-busy-label="Changing&#x2026;">Change password</button>
